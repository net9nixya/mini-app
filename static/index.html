<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <title>Pulse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--tg-theme-bg-color, #0d0d1a);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            max-width: 400px;
            width: 100%;
            background: var(--tg-theme-secondary-bg-color, #16162e);
            border-radius: 32px;
            padding: 40px 28px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            opacity: 0;
            animation: fadeUp 0.5s ease forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 16px;
            background: var(--tg-theme-button-color, #2d9cdb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(45,156,219,0.3);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .greeting {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }
        .greeting span { color: var(--tg-theme-link-color, #2d9cdb); }
        .counter-wrap {
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 24px 16px;
            margin-bottom: 32px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .counter-number {
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -3px;
            background: linear-gradient(135deg, #ffffff 60%, rgba(255,255,255,0.4));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .counter-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.35;
            margin-top: 8px;
            font-weight: 500;
        }
        .btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 18px;
            background: var(--tg-theme-button-color, #2d9cdb);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.25s, opacity 0.2s;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(45,156,219,0.2);
        }
        .btn:active { transform: scale(0.96); }
        .btn.loading { opacity: 0.6; pointer-events: none; }
        @media (max-width: 400px) {
            .card { padding: 32px 20px 28px; border-radius: 24px; }
            .greeting { font-size: 24px; margin-bottom: 24px; }
            .counter-number { font-size: 56px; }
            .btn { font-size: 16px; padding: 16px; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="avatar" id="avatar">?</div>
    <div class="greeting">Привет, <span id="name">игрок</span></div>

    <div class="counter-wrap">
        <div class="counter-number" id="countDisplay">0</div>
        <div class="counter-label">Кликов</div>
    </div>

    <button class="btn" id="mainBtn">нажми если пидор</button>
</div>

<script>
(function () {
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const user = tg.initDataUnsafe?.user || {};
    const nameEl = document.getElementById("name");
    const avatarEl = document.getElementById("avatar");
    const countDisplay = document.getElementById("countDisplay");
    const mainBtn = document.getElementById("mainBtn");

    if (user.first_name) {
        nameEl.textContent = user.first_name;
    }

    if (user.id) {
        const initial = user.first_name?.charAt(0).toUpperCase() || "?";
        avatarEl.textContent = initial;

        fetch(`/api/photo?user_id=${encodeURIComponent(user.id)}`)
            .then(res => res.json())
            .then(data => {
                if (data.photo_url) {
                    avatarEl.innerHTML = "";
                    const img = document.createElement("img");
                    img.src = data.photo_url;
                    img.alt = "avatar";
                    avatarEl.appendChild(img);
                }
            })
            .catch(err => console.warn("Не удалось загрузить аватарку:", err));
    }

    let count = 0;

    function updateUI() {
        countDisplay.textContent = count;
    }

    function sendToBot() {
        try {
            tg.sendData(JSON.stringify({
                action: "click",
                count: count,
                user_id: user.id || null
            }));
        } catch (e) {}
    }

    function handleClick() {
        count++;
        updateUI();
        sendToBot();
        mainBtn.classList.add("loading");
        setTimeout(() => mainBtn.classList.remove("loading"), 150);
    }

    mainBtn.addEventListener("click", handleClick);

    mainBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            handleClick();
        }
    });

    updateUI();

    setTimeout(() => {
        try {
            tg.sendData(JSON.stringify({
                action: "init",
                user_id: user.id || null,
                first_name: user.first_name || ""
            }));
        } catch (e) {}
    }, 300);
})();
</script>
</body>
</html>
