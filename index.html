<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <title>Pulse Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--tg-theme-bg-color, #0f0f1a);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .card {
            max-width: 420px;
            width: 100%;
            background: var(--tg-theme-secondary-bg-color, #1a1a2e);
            border-radius: 28px;
            padding: 32px 24px 40px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: background 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            opacity: 0;
            animation: fadeUp 0.4s ease forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--tg-theme-button-color, #2d9cdb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 600;
            color: #fff;
            margin: 0 auto 16px;
            box-shadow: 0 4px 16px rgba(45, 156, 219, 0.25);
            user-select: none;
            text-transform: uppercase;
        }

        .greeting {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }
        .greeting span {
            color: var(--tg-theme-link-color, #2d9cdb);
        }

        .sub {
            font-size: 14px;
            opacity: 0.5;
            margin-bottom: 24px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 12px 16px;
            min-width: 80px;
            flex: 1;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-item .num {
            font-size: 26px;
            font-weight: 700;
            display: block;
            line-height: 1.2;
        }
        .stat-item .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            background: var(--tg-theme-button-color, #2d9cdb);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            touch-action: manipulation;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.08);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .btn:active::after {
            opacity: 1;
        }

        .reset-btn {
            background: transparent;
            border: none;
            color: var(--tg-theme-hint-color, #888);
            font-size: 13px;
            padding: 12px 0 4px;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s;
            width: 100%;
        }
        .reset-btn:hover {
            opacity: 0.8;
        }

        .btn.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        @media (prefers-color-scheme: light) {
            body {
                background: var(--tg-theme-bg-color, #f0f2f5);
            }
            .card {
                background: var(--tg-theme-secondary-bg-color, #ffffff);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            }
            .stat-item {
                background: rgba(0, 0, 0, 0.03);
                border-color: rgba(0, 0, 0, 0.04);
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 24px 16px 32px;
            }
            .avatar {
                width: 68px;
                height: 68px;
                font-size: 30px;
            }
            .greeting {
                font-size: 20px;
            }
            .stat-item .num {
                font-size: 22px;
            }
            .btn {
                font-size: 16px;
                padding: 14px;
            }
        }

        @media (max-width: 340px) {
            .stats {
                flex-direction: column;
                gap: 6px;
            }
            .stat-item {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar" id="avatar">?</div>
        <div class="greeting">Привет, <span id="name">игрок</span></div>
        <div class="sub" id="user-id">ID: —</div>

        <div class="stats">
            <div class="stat-item">
                <span class="num" id="countDisplay">0</span>
                <span class="label">Кликов</span>
            </div>
            <div class="stat-item">
                <span class="num" id="statusDisplay">0</span>
                <span class="label">Статус</span>
            </div>
        </div>

        <button class="btn" id="mainBtn">Нажми, если ты пидор</button>
        <button class="reset-btn" id="resetBtn">Сбросить счёт</button>
    </div>

    <script>
        (function() {
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            const user = tg.initDataUnsafe?.user || {};
            const nameEl = document.getElementById('name');
            const userIdEl = document.getElementById('user-id');
            const avatarEl = document.getElementById('avatar');

            if (user.first_name) {
                nameEl.textContent = user.first_name;
                avatarEl.textContent = user.first_name.charAt(0).toUpperCase();
            }
            if (user.id) {
                userIdEl.textContent = 'ID: ' + user.id;
            }

            const countDisplay = document.getElementById('countDisplay');
            const statusDisplay = document.getElementById('statusDisplay');
            const mainBtn = document.getElementById('mainBtn');
            const resetBtn = document.getElementById('resetBtn');

            let count = 0;

            function updateUI() {
                countDisplay.textContent = count;
                if (count === 0) {
                    statusDisplay.textContent = '0';
                } else if (count < 5) {
                    statusDisplay.textContent = '1';
                } else if (count < 15) {
                    statusDisplay.textContent = '2';
                } else if (count < 30) {
                    statusDisplay.textContent = '3';
                } else {
                    statusDisplay.textContent = '4';
                }
            }

            function sendToBot() {
                try {
                    tg.sendData(JSON.stringify({
                        action: 'click',
                        count: count,
                        user_id: user.id || null
                    }));
                } catch (e) {}
            }

            function handleClick() {
                count++;
                updateUI();
                sendToBot();
                mainBtn.classList.add('loading');
                setTimeout(() => mainBtn.classList.remove('loading'), 200);
            }

            function handleReset() {
                if (count === 0) return;
                count = 0;
                updateUI();
                sendToBot();
                try {
                    tg.HapticFeedback?.impactOccurred('light');
                } catch (_) {}
            }

            mainBtn.addEventListener('click', handleClick);
            resetBtn.addEventListener('click', handleReset);

            mainBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleClick();
                }
            });

            updateUI();

            setTimeout(() => {
                try {
                    tg.sendData(JSON.stringify({
                        action: 'init',
                        user_id: user.id || null,
                        first_name: user.first_name || ''
                    }));
                } catch (_) {}
            }, 300);

        })();
    </script>

</body>
</html>
