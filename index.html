<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <title>Pulse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--tg-theme-bg-color, #0d0d1a);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .card {
            max-width: 400px;
            width: 100%;
            background: var(--tg-theme-secondary-bg-color, #16162e);
            border-radius: 32px;
            padding: 40px 28px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            transition: background 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0;
            animation: fadeUp 0.5s ease forwards;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d9cdb, #1a6b9e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 600;
            color: #fff;
            margin: 0 auto 16px;
            box-shadow: 0 6px 24px rgba(45, 156, 219, 0.3);
            user-select: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .greeting {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }
        .greeting span {
            color: var(--tg-theme-link-color, #2d9cdb);
        }

        .sub {
            font-size: 14px;
            opacity: 0.4;
            margin-bottom: 28px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .counter-wrap {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .counter-number {
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #ffffff 60%, rgba(255,255,255,0.4));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .counter-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.35;
            margin-top: 6px;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 18px;
            background: var(--tg-theme-button-color, #2d9cdb);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.25s ease, opacity 0.2s ease;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(45, 156, 219, 0.2);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.08);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .btn:active::after {
            opacity: 1;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--tg-theme-hint-color, #888);
            font-size: 14px;
            padding: 14px;
            margin-top: 12px;
            border-radius: 14px;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s, border-color 0.2s;
            width: 100%;
            font-weight: 500;
            letter-spacing: 0.3px;
            box-shadow: none;
        }

        .btn-secondary:hover {
            opacity: 0.7;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        @media (prefers-color-scheme: light) {
            body {
                background: var(--tg-theme-bg-color, #f0f2f5);
            }
            .card {
                background: var(--tg-theme-secondary-bg-color, #ffffff);
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
                border-color: rgba(0, 0, 0, 0.04);
            }
            .counter-wrap {
                background: rgba(0, 0, 0, 0.02);
                border-color: rgba(0, 0, 0, 0.04);
            }
            .counter-number {
                background: linear-gradient(135deg, #1a1a2e 60%, #555);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .btn-secondary {
                border-color: rgba(0, 0, 0, 0.08);
                color: #666;
            }
            .btn-secondary:hover {
                border-color: rgba(0, 0, 0, 0.15);
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 28px 20px 28px;
                border-radius: 24px;
            }
            .avatar {
                width: 72px;
                height: 72px;
                font-size: 30px;
            }
            .greeting {
                font-size: 22px;
            }
            .counter-number {
                font-size: 52px;
            }
            .btn {
                font-size: 16px;
                padding: 16px;
            }
        }

        @media (max-width: 340px) {
            .card {
                padding: 20px 16px 24px;
            }
            .avatar {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            .counter-number {
                font-size: 44px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar" id="avatar">?</div>
        <div class="greeting">Привет, <span id="name">игрок</span></div>
        <div class="sub" id="user-id">ID: —</div>

        <div class="counter-wrap">
            <div class="counter-number" id="countDisplay">0</div>
            <div class="counter-label">Кликов</div>
        </div>

        <button class="btn" id="mainBtn">Нажми, если ты пидор</button>
        <button class="btn-secondary" id="resetBtn">Сбросить</button>
    </div>

    <script>
        (function() {
            const tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();

            const user = tg.initDataUnsafe?.user || {};
            const nameEl = document.getElementById('name');
            const userIdEl = document.getElementById('user-id');
            const avatarEl = document.getElementById('avatar');

            if (user.first_name) {
                nameEl.textContent = user.first_name;
                avatarEl.textContent = user.first_name.charAt(0).toUpperCase();
            }
            if (user.id) {
                userIdEl.textContent = 'ID: ' + user.id;
            }

            const countDisplay = document.getElementById('countDisplay');
            const mainBtn = document.getElementById('mainBtn');
            const resetBtn = document.getElementById('resetBtn');

            let count = 0;

            function updateUI() {
                countDisplay.textContent = count;
            }

            function sendToBot() {
                try {
                    tg.sendData(JSON.stringify({
                        action: 'click',
                        count: count,
                        user_id: user.id || null
                    }));
                } catch (e) {}
            }

            function handleClick() {
                count++;
                updateUI();
                sendToBot();
                mainBtn.classList.add('loading');
                setTimeout(() => mainBtn.classList.remove('loading'), 150);
            }

            function handleReset() {
                if (count === 0) return;
                count = 0;
                updateUI();
                sendToBot();
                try {
                    tg.HapticFeedback?.impactOccurred('light');
                } catch (_) {}
            }

            mainBtn.addEventListener('click', handleClick);
            resetBtn.addEventListener('click', handleReset);

            mainBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleClick();
                }
            });

            updateUI();

            setTimeout(() => {
                try {
                    tg.sendData(JSON.stringify({
                        action: 'init',
                        user_id: user.id || null,
                        first_name: user.first_name || ''
                    }));
                } catch (_) {}
            }, 300);

        })();
    </script>

</body>
</html>
